        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/feedback:
    post:
      tags: [Sessions]
      summary: Ask Iris to fix something, as a new run
      description: |
        Starts a new run of the same document, with the feedback given to every agent. The delivered HTML
        is copied to `history/` first. Only when `ready_for_review`; until the new run finishes, more
        feedback gets 409. The answer is `running`, or `queued` when every run slot is busy.

        Iris routes the feedback (its `feedback_scoped` log line says which):

        - `document`: the pages are kept, the saved body is re-checked, and the review runs again with the
          feedback. For tone, wording, order or an accessibility rule.
        - `extraction`: the named pages are read again from their images, then joined and reviewed. For
          content that was misread or missed, which the reader cannot see because it never sees the images.

        It chooses `document` when the pages cannot be pinned down, or when the feedback claims more than half
        the document.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [feedback], properties: {feedback: {type: string}}}
      responses:
        "202":
          description: Accepted. Poll the session again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {type: string, enum: [running, queued]}
                  phase: {type: string, enum: [extraction]}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/close:
    post:
      tags: [Sessions]
      summary: Accept the document
      description: |
        Accept the document: the output is final and the session's scratch files are deleted. Its pages
        become examples future page-agent changes are checked against. Only when `ready_for_review` (409
        otherwise). Suggestions were already saved during the run, so close does nothing more.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: {type: object, properties: {session_id: {type: string}, status: {type: string, enum: [closed]}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/fields:
    get:
      tags: [Tagged PDF]
      summary: The PDF's form fields
      description: |
        Only on a deployment that runs equalify-iris-pdf
        (`tagged_pdf.command` set; `GET /v1/limits` says), else 404 `tagged_pdf_unavailable`. Only for a
        session made from one PDF, else 409 `no_source_pdf`.

        - A PDF with no form answers `{"fields": []}`.
        - `label` is the field's tooltip. An iris-pdf older than
          equalify-iris-pdf#49 leaves it out.
        - A flat form, such as a scan, has no fields of its own. Once the session is `ready_for_review`
          or `closed`, and its HTML has form controls, Iris tags it once and lists the fields it adds,
          each with `"created": true`. `POST /pdf` fills them by those names. If that fails, or iris-pdf
          is older than equalify-iris-pdf#16, the list
          is empty.
        - At most two tagger runs at once, counting `/fields` and `/pdf` together. A third gets 503
          `busy` with `Retry-After`.
        - The tagger's own errors keep its code: 400 for a bad request, 422 for a PDF it refuses, 504
          `timeout` after `tagged_pdf.timeout_seconds` (300 by default).
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The fields.
          content:
            application/json:
              schema: {type: object, properties: {fields: {type: array, items: {$ref: "#/components/schemas/Field"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/pdf:
    post:
      tags: [Tagged PDF]
      summary: The original PDF, tagged, with its form filled in
      description: |
        The session's PDF, tagged from the first pass's HTML for each page, before review. Same feature
        check, one-PDF rule, two-run limit and tagger errors as `GET /fields`.

        - The session must be `ready_for_review` or `closed`, else 409 `invalid_state`.
        - `values` is optional, keyed by field name. A text field takes a string, a checkbox `true` or
          `false`, a multi-select list an array. Fields left out keep what the PDF had. `values` that is
          not an object is 400 `invalid_request`.
        - Values are used for this request only, never stored or logged. The run log records only
          the field names given.
        - A page that failed extraction is left out; the report lists it as `page_not_in_html`.
        - `report.warnings` lists what the tagger could not do cleanly. A PDF that was already tagged has
          its tags replaced, with a `retagged` warning (an iris-pdf older than
          equalify-iris-pdf#8 answers 422 `already_tagged`).
        - In audit mode `report.detail` adds the structure tree, the words each page could not match and
          why, the fields added and not matched, and time per step. Iris asks for it only when iris-pdf's
          `tag --help` lists `--report-detail`. It never holds a form value.
        - 422 `permissions_denied`: the owner locked the PDF against changes; ask for an unlocked copy. A
          locked PDF that still lets accessibility tools read it is tagged, with an `owner_restricted`
          warning, and keeps its restrictions. If filling in is also forbidden, any values get 422
          `values_not_permitted`; empty `values` still gets the tagged copy.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {values: {type: object, description: Field name to value.}}}
      responses:
        "200":
          description: The PDF and iris-pdf's report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename: {type: string, description: The name to save as.}
                  pdf: {type: string, contentEncoding: base64}
                  report: {type: object, description: "What iris-pdf did and checked: source, pages, structure, form, verification, warnings, and in audit mode detail."}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit:
    get:
      tags: [Audit]
      summary: What audit mode kept for a session
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The list, with a URL for each item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  pages: {type: array, items: {type: object, properties: {order: {type: integer}, name: {type: string}, media_type: {type: string}, bytes: {type: integer}, sha256: {type: string}, url: {type: string}}}}
                  files: {type: array, items: {type: object, properties: {name: {type: string}, bytes: {type: integer}, url: {type: string}}}}
                  runs: {type: array, items: {type: object}}
                  prompts: {type: object, properties: {count: {type: integer}, url: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
      description: |
        Audit mode only (`server.audit`, or `iris convert --audit`); otherwise 404 `audit_off`. Each run then
        keeps the prompts it sent and the document after assembly (`assembled`) and after each review round (`round-<n>`), served with
        the page images and working files. Answers while the run works. Anyone who can read a session can
        read all of this.
        Prompts never hold form values: those go only to `POST /pdf`, which calls no model.

  /v1/sessions/{id}/audit/pages/{order}:
    get:
      tags: [Audit]
      summary: A page image, as the models saw it
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {name: order, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: The image.}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit/files/{name}:
    get:
      tags: [Audit]
      summary: One of the session's working files
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - name: name
          in: path
          required: true
          schema: {type: string, enum: [final.json, lint.json, links.json, fields.json, text-layer.json, unresolved.md, agent-updates.md, source.pdf]}
      responses:
        "200": {description: The file.}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit/prompts/{hash}:
    get:
      tags: [Audit]
      summary: One message as sent to a model
      description: |
        Named by a `model_call_start` line's `prompt`. Never holds a form value: those go only to `POST /pdf`, which calls no model.
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {name: hash, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      responses:
        "200":
          description: The text.
          content: {text/plain: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
