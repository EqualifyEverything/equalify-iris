                    description: Correction rounds that hit the output ceiling, in rounds.
                  pages_failed: {type: array, items: {type: integer}, description: Pages with no content in the document.}
                  pages_blank: {type: array, items: {type: integer}, description: Pages reported empty.}
                  pages_bare_html: {type: array, items: {type: integer}, description: Pages delivered without their log.}
                  fidelity_observed:
                    type: object
                    required: [observed, pages, unattached_pages, kinds, unattached, unplaced]
                    properties:
                      observed: {type: integer}
                      pages: {type: array, items: {type: integer}}
                      unattached_pages: {type: array, items: {type: integer}}
                      kinds:
                        type: object
                        required: [content_missing, content_wrong, structure_wrong, a11y_only, alt_quality, untagged]
                        properties:
                          content_missing: {type: integer}
                          content_wrong: {type: integer}
                          structure_wrong: {type: integer}
                          a11y_only: {type: integer}
                          alt_quality: {type: integer}
