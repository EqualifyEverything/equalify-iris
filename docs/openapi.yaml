openapi: 3.1.0
info:
  title: Equalify Iris API
  version: 1.4.0
  summary: Turn a PDF or page images into accessible HTML, and optionally tag the original PDF.
  description: |
    The exact contract for every endpoint. To see each one work on a real document, in plain
    language, open `/how-it-works` on a running Iris.

    There is no sign-in and no account. A deployment is open or gated. Open: `server.api_token` is
    blank, so send no `Authorization` header. Gated: send `Authorization: Bearer <the token>`. The
    token says whether a caller may use the API, not who they are: every session belongs to the
    deployment. `GET /v1/me` with no header answers 200 when open and 401 when gated.

    The token covers `/v1/me`, `/v1/settings` and everything under `/v1/sessions`. The rest stays
    open on a gated deployment, because none of it touches a document (docs/access.md says why for
    each). `/v1/quality` and `/v1/suggestions` have their own token instead.

    Errors share one shape, `{"error": {"code", "message", "details"}}`, except the two endpoints
    behind the quality token, which answer `{"error", "message"}`.

    Requests are limited per address, per minute: `general_per_minute` (default 240) for all of `/v1`
    except `/v1/health`, and `upload_per_minute` (default 12) for uploads (`GET /v1/limits` has the
    numbers). Every answer except `/v1/health` carries `ratelimit` and `ratelimit-policy` headers. Over
    budget is 429 with `Retry-After` in seconds: wait that long. Poll a session every 2 to 5 seconds.

    Two upload refusals, both normally answered before the body is read:

    - 413 `upload_too_large`: over `upload.max_request_bytes`. Split the batch. `details` has
      `declared_bytes`, or `received_bytes` when the request has no declared length and is cut off as
      it arrives.
    - 429: too much upload in flight across all callers (`max_upload_memory_bytes` in `details`). Retry
      in a few seconds.

    Behind NAT or a shared proxy you share a budget;
    operators must set `server.trust_proxy`, or every request looks like the proxy's.
    `test/e2e.sh` makes these calls against mocks and checks each answer against this document.
servers:
  - url: /
tags:
  - name: Deployment
    description: What this deployment is, accepts and has done.
  - name: Sessions
    description: One document's conversion, from upload to the finished HTML.
  - name: Tagged PDF
    description: The original PDF, tagged by iris-pdf. Only where the deployment makes them.
  - name: Audit
    description: Page images, prompts and the document between steps. Only in audit mode.
  - name: Operators
    description: Deployment-wide numbers, behind the quality token.

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "`server.api_token`. Needed only where the deployment sets it."
    qualityToken:
      type: http
      scheme: bearer
      description: "`server.quality_token`. The endpoint answers 404 when it is not set."
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^ses_[A-Za-z0-9]+$"}
  responses:
    Error:
      description: An error. `code` is one of `ErrorCode`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TokenError:
      description: Missing or wrong quality token (401), or the endpoint is off (404).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TokenError"}
  schemas:
    ErrorCode:
      type: string
      description: |
        Iris's own codes are listed in `x-codes`. On `/fields` and `/pdf`, iris-pdf's own codes pass
        through as well, such as `permissions_denied` or `values_not_permitted`.

        - 400 `invalid_request`, also any other 4xx refused while reading the request.
        - 401 `unauthorized`.
        - 404 `session_not_found`; `not_found` for no such route; `audit_off`; `tagged_pdf_unavailable`.
        - 409 `invalid_state`: the session is not in a state that allows this. `no_source_pdf`.
        - 410 `session_expired`: past retention.
        - 413 `upload_too_large`, or `body_too_large` for a JSON body over 2 MB.
        - 422 `pdf_conversion_failed`: an uploaded PDF could not be read.
        - 429 `rate_limited`, with `Retry-After`.
        - 500 `server_error`; `tagger_failed`.
        - 503 `busy`, with `Retry-After`. 504 `timeout`.
      x-codes:
        - invalid_request
        - body_too_large
        - upload_too_large
        - unauthorized
        - rate_limited
        - not_found
        - session_not_found
        - session_expired
        - invalid_state
        - pdf_conversion_failed
        - audit_off
        - tagged_pdf_unavailable
        - no_source_pdf
        - tagger_failed
        - timeout
        - busy
        - server_error
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, description: A sentence a person can act on.}
            details: {type: object, description: Numbers behind the error, such as a limit.}
    TokenError:
      type: object
      required: [error, message]
      properties:
        error: {type: string, enum: [unauthorized, not_found]}
        message: {type: string}
    SessionStatus:
      type: string
      enum: [queued, running, ready_for_review, closed, failed]
      description: |
        `queued` waits for a free slot; `running` is working; `ready_for_review` has its HTML;
        `closed` was accepted; `failed` has an `error`.
    Phase:
      type: string
      enum: [extraction, assembly, review, done]
      description: The step a running session is in.
    Session:
      type: object
      required: [session_id, status, phase, iterations_completed, iterations_max, image_count, created_at, updated_at]
      properties:
        session_id: {type: string}
        status: {$ref: "#/components/schemas/SessionStatus"}
        phase: {$ref: "#/components/schemas/Phase"}
        iterations_completed: {type: integer, description: Review rounds finished.}
        iterations_max: {type: integer, description: The review cap this session got when it was made.}
        image_count: {type: integer, description: Pages.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        error: {type: string, description: Only on a failed session.}
        expired_at: {type: string, format: date-time, description: Only once retention deleted its files.}
    Usage:
      type: object
      properties:
        count: {type: integer}
        total_ms: {type: integer}
        max_ms: {type: integer}
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        cache_read_input_tokens: {type: integer}
        cache_creation_input_tokens: {type: integer}
        models: {type: array, items: {type: string}}
    Field:
      type: object
      required: [name, type, page]
      properties:
        name: {type: string, description: The PDF's own field name. Send values under it.}
        label: {type: [string, "null"], description: The field's tooltip, when the PDF has one.}
        type: {type: string, enum: [text, checkbox, radio, combobox, listbox, button, signature]}
        page: {type: integer}
        rect: {type: array, items: {type: number}}
        options: {type: array, items: {type: string}}
        required: {type: boolean}
        readonly: {type: boolean}
        maxlen: {type: [integer, "null"]}
        editable: {type: boolean}
        multiSelect: {type: boolean}
        created: {type: boolean, description: A field iris-pdf would add to a flat form.}

paths:
  /v1/health:
    get:
      tags: [Deployment]
      summary: Is Iris up?
      description: |
        `version` is the running build's, so this is how you check a deployment is the one you meant to
        deploy. Never gated and never rate limited: the container's `HEALTHCHECK` polls it.
      responses:
        "200":
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, enum: [ok]}
                  service: {type: string}
                  version: {type: string}

  /v1/openapi.json:
    get:
      tags: [Deployment]
      summary: This document, as JSON
      responses:
        "200": {description: The OpenAPI document.}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/stats:
    get:
      tags: [Deployment]
      summary: How much this deployment has converted
      description: |
        A public, deployment-wide tally: no session ids, file names or content. Cached for 60 seconds
        (`Cache-Control: public, max-age=60`), so a new document can take a minute to appear.

        - A session counts once it first reaches `ready_for_review`, and stays counted if a later
          re-run fails. A re-run does not count its pages again. Queued, running and never-finished
          sessions are not counted.
        - `quality` covers the last 30 days and is always present. It is `null` until that window holds
          20 documents, a privacy floor.
        - `clean_rate` is the Reader Agent's verdict, not the final axe result. A document part of
          which the reviewer never answered about is not clean.
        - `mean_rounds` is 0 when the first reading found nothing, but the loop also stops when a round
          changes nothing, so read it beside `clean_rate`.
        - The difference between two reads is per-upload (one more document, 40 more pages), so a
          deployment that treats document sizes as private should not expose this endpoint.
      responses:
        "200":
          description: The tally.
          content:
            application/json:
              schema:
                type: object
                required: [pages_processed, documents_processed, since, quality]
                properties:
                  pages_processed: {type: integer, description: Pages delivered, all time, counting each document's first run.}
                  documents_processed: {type: integer, description: Documents delivered, all time. A 40-page PDF is one.}
                  since: {type: [string, "null"], format: date-time, description: When the earliest counted document finished; `null` before any.}
                  quality:
                    type: [object, "null"]
                    description: "Last 30 days. `null` until the window holds 20 documents."
                    required: [window_days, documents, clean_rate, mean_rounds]
                    properties:
                      window_days: {type: integer, description: "Always 30."}
                      documents: {type: integer, description: Documents delivered in the window.}
                      clean_rate: {type: number, description: "Share (0-1) of documents the reviewer read in full and left nothing open on."}
                      mean_rounds: {type: number, description: Mean review rounds per document.}
        "429": {$ref: "#/components/responses/Error"}

  /v1/limits:
    get:
      tags: [Deployment]
      summary: What an upload may be
      description: |
        What this deployment accepts, worked out from the model and provider it runs, so a client never
        hardcodes numbers that change with the model. The demo states its limits from this.

        - `image.max_bytes` is what the upload enforces per image. `hint` is the same sentence the upload's
          400 carries: quote it rather than writing your own, since it is worded for whichever model is
          configured. If you can show one number, show `max_bytes`.
        - `max_dimension_px` is enforced when the file's header can be read. `max_long_edge_px` is advice: the
          model shrinks past it instead of failing.
        - For a vision model Iris has no published limits for, the pixel numbers are conservative stand-ins,
          enforced the same way.
        - `upload` is what one request may be. The byte total is checked before the body is read (or as it
          arrives, without a declared length); the part count is refused during parsing.
        - `rate_limits` is `null` where the app does not limit requests, meaning "not limiting", not "unknown".
        - The model and provider are not named here: see `GET /v1/settings`, which needs the token.
      responses:
        "200":
          description: The limits.
          content:
            application/json:
              schema:
                type: object
                required: [max_pages, image, pdf, upload, rate_limits, tagged_pdf]
                properties:
                  max_pages: {type: integer}
                  image:
                    type: object
                    properties:
                      max_bytes: {type: integer}
                      max_long_edge_px: {type: integer, description: The size the vision model reads at.}
                      max_dimension_px: {type: integer}
                      media_types: {type: array, items: {type: string}}
                      extensions: {type: array, items: {type: string}}
                      hint: {type: string, description: The limits as a sentence.}
                  pdf: {type: object, properties: {max_pages: {type: integer}}}
                  upload: {type: object, properties: {max_files: {type: integer}, max_request_bytes: {type: integer}}}
                  rate_limits:
                    type: [object, "null"]
                    description: "`null` when limits are off."
                    properties:
                      general_per_minute: {type: integer}
                      upload_per_minute: {type: integer}
                      max_upload_memory_mb: {type: integer}
                      window_seconds: {type: integer}
                  tagged_pdf: {type: boolean, description: Whether this deployment makes tagged PDFs.}
        "429": {$ref: "#/components/responses/Error"}

  /v1/me:
    get:
      tags: [Deployment]
      summary: Can I use this deployment?
      description: |
        Call this first. It runs the same check an upload runs, so 200 means usable (and, with no header,
        open), and 401 means the deployment needs `server.api_token` from its operator.
        `defaults.max_review_iterations` is the review cap every new session gets.
      security: [{}, {apiKey: []}]
      responses:
        "200":
          description: Usable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaults: {type: object, properties: {max_review_iterations: {type: integer}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/settings:
    get:
      tags: [Deployment]
      summary: How this deployment is set up
      description: |
        Every non-secret setting as Iris uses it, after defaults, and the provider and model each agent
        resolves to for each kind of call. `agents` lists the four agents every run uses, then the
        specialists in `agents/`. `purpose` is the opening of an agent file's Purpose section, `null` for
        the reader and copy editor, whose prompts are in the code. Which kinds of call an agent makes
        depends on the step: a run's `model_call` lines say what ran. `prices` are the operator's, in US
        dollars per million tokens. Never a key, token, provider URL, file path or inference-profile ARN.
      security: [{}, {apiKey: []}]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [version, access, run, retention_days, tagged_pdf, providers, agents]
                properties:
                  version: {type: string}
                  access:
                    type: object
                    properties:
                      api_key_required: {type: boolean}
                      audit: {type: boolean}
                      quality_report: {type: boolean}
                  run:
                    type: object
                    properties:
                      max_review_iterations: {type: integer}
                      extraction_concurrency: {type: integer, description: Pages read at once.}
                      max_concurrent_runs: {type: integer, description: Documents converted at once.}
                      recheck_sample_size: {type: integer}
                  retention_days: {type: [integer, "null"]}
                  tagged_pdf:
                    type: object
                    properties:
                      on: {type: boolean}
                      version: {type: [string, "null"]}
                      timeout_seconds: {type: integer}
                  providers:
                    type: object
                    properties:
                      default: {type: string}
                      blocks:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            api: {type: string}
                            region: {type: string}
                            default_model: {type: string}
                            per_capability: {type: object}
                            max_tokens: {type: integer}
                            prompt_cache: {type: boolean}
                            prompt_cache_ttl: {type: string}
                            inference_profiles: {type: array, items: {type: string}}
                            prices: {type: object, description: US dollars per million tokens, by model, as the operator set them.}
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        agent: {type: string}
                        kind: {type: string, enum: [core, specialist]}
                        purpose: {type: [string, "null"]}
                        models: {type: object, description: "Per capability (`vision`, `text`, `structured_output`): `{provider, model}`."}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/quality:
    get:
      tags: [Operators]
      summary: How good the output has been
      description: |
        Rates over recent documents, for the weekly quality report. Field meanings in full: docs/run-log.md,
        "Quality tally".

        - Off unless `server.quality_token` (`IRIS_QUALITY_TOKEN`) is set: then 404, not 401.
        - Its own token, not `server.api_token`, and `api_token` does not gate it.
        - No field carries document content; the report copies these values into a public issue.
        - `Cache-Control: no-store`, but each window's answer is cached in the process for 5 minutes.
        - `documents` counts sessions: a file uploaded three times is three. Every rate is a share of
          `documents`, 0 when there are none.
      security: [{qualityToken: []}]
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
          description: The window, in days. Clamped to 1-365; a value that is not a number means 30.
      responses:
        "200":
          description: The tally.
          content:
            application/json:
              schema:
                type: object
                required: [window_days, documents, files, documents_unhashed, since, mean_rounds, unresolved_rate, first_read, unresolved_severity, review_stopped, links_dropped_rate, links_unresolved_rate, markup_unbalanced_rate, table_no_body_rate, structural_defect_rate, lint_error_rate, lint_error_where, documents_linted, editor_truncated_rate, editor_truncated_lost_rate, editor_headings_gated_rate, review_unread_rate, unfinished_page_rate, rules]
                properties:
                  window_days: {type: integer, description: The window used.}
                  documents: {type: integer, description: Documents delivered in the window, flawless ones included.}
                  files: {type: integer, description: Distinct uploads they came from.}
                  documents_unhashed: {type: integer, description: Documents too old to have an upload hash.}
                  since: {type: [string, "null"], format: date-time, description: The earliest document in the window.}
                  mean_rounds: {type: [number, "null"], description: Mean Copy Editor rounds per document; `null` when none ran.}
                  unresolved_rate: {type: number, description: Finished with issues left open.}
                  first_read:
                    type: object
                    description: What the reviewer found before anything was fixed.
                    required: [documents, mean_issues, unread_documents]
                    properties:
                      documents: {type: integer, description: Documents that recorded a first read.}
                      mean_issues: {type: [number, "null"], description: Mean issues the first read raised.}
                      unread_documents: {type: integer, description: Of those, part of the first read was unusable.}
                  unresolved_severity:
                    type: array
                    description: Documents with an open issue at each severity. Not a partition.
                    items:
                      type: object
                      required: [severity, documents]
                      properties:
                        severity: {type: string, enum: [high, medium, low, unrated]}
                        documents: {type: integer}
                  review_stopped:
                    type: array
                    description: Which exit ended each document. A partition of the documents that recorded an exit.
                    items:
                      type: object
                      required: [where, documents]
                      properties:
                        where: {type: string, enum: [clean, unread, converged, truncated, cap]}
                        documents: {type: integer}
                  links_dropped_rate: {type: number, description: A link was lost by the Copy Editor.}
                  links_unresolved_rate: {type: number, description: A link points nowhere in the document.}
                  markup_unbalanced_rate: {type: number, description: An element is left unclosed.}
                  table_no_body_rate: {type: number, description: A table has no content rows.}
                  structural_defect_rate: {type: number, description: A label or reference names something missing.}
                  lint_error_rate: {type: number, description: The accessibility check could not run.}
                  lint_error_where:
                    type: array
                    description: Which lint step failed.
                    items:
                      type: object
                      required: [where, documents]
                      properties:
                        where: {type: string, enum: [parse, inject, run]}
                        documents: {type: integer}
                  documents_linted: {type: integer, description: Documents the check examined.}
                  editor_truncated_rate: {type: number, description: A Copy Editor reply was cut off.}
                  editor_truncated_lost_rate: {type: number, description: Part of the document got no Copy Editor pass.}
                  editor_headings_gated_rate: {type: number, description: Edits were refused for losing headings.}
                  review_unread_rate: {type: number, description: Part of the last read came back unusable.}
                  unfinished_page_rate: {type: number, description: A page is marked as not fully transcribed.}
                  rules:
                    type: array
                    description: Accessibility rules still failing, most documents first.
                    items:
                      type: object
                      required: [id, impact, documents, share, nodes]
                      properties:
                        id: {type: string, description: The axe-core rule.}
                        impact: {type: [string, "null"]}
                        documents: {type: integer}
                        share: {type: number, description: Of `documents_linted`.}
                        nodes: {type: integer, description: Offending elements, in total.}
        "401": {$ref: "#/components/responses/TokenError"}
        "404": {$ref: "#/components/responses/TokenError"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/suggestions:
    get:
      tags: [Operators]
      summary: Agents Iris suggested, for maintainers
      description: |
        Every suggestion this deployment saved, grouped. Every run saves suggestions, with no opt-out:

        - a new-agent suggestion when a page holds content a specialist would handle better (name, page,
          reason)
        - an agent-update proposal when feedback produced a lesson that generalizes and passed the agent's
          fixtures (the lesson and the proposed prompt)

        Iris files nothing itself. A workflow, `.github/workflows/agent-suggestions.yml`, reads this, groups
        what means the same thing, and opens or updates one public issue per idea. Run it only against a
        deployment whose documents are public: the reasons and prompts are model-written text about them.
        Saving never fails a run; a failure is logged as `contribution_failed`.

        `key` groups names that differ only in case, punctuation, or a trailing "agent" or "specialist".
        `pages` and `reasons` hold the 10 most recent; `latest` is the newest proposal, with the full prompt
        in `content`. Same token as `/v1/quality`: 404 when unset, 401 without it.
      security: [{qualityToken: []}]
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_agents: {type: array, items: {type: object}}
                  agent_updates: {type: array, items: {type: object}}
        "401": {$ref: "#/components/responses/TokenError"}
        "404": {$ref: "#/components/responses/TokenError"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions:
    get:
      tags: [Sessions]
      summary: List sessions, newest first
      description: |
        Newest first. This lists every session, not just yours. There is no sign-in, so any caller sees
        every session's id, status, page count and times, and an id is all `/output` needs. Gate a
        deployment that handles anything private. To follow your own work, keep the `session_id` the upload
        returned.

        - `limit`: 20 by default, at most 100. Anything that is not an integer of 1 or more is the default.
        - `cursor`: pass `next_cursor` back byte for byte, percent-encoded in the URL (`%7C` for its `|`).
          It is checked against the exact format Iris writes, so anything else is 400, never a silent restart.
          One exception: a bare timestamp with no `|` (a cursor from before the compound one) is still
          accepted, and that one request skips sessions created in the same millisecond. The next cursor is
          compound, so it clears itself; if a client reports a gap during an upgrade, this is why.
          Stop when `next_cursor` is `null`, not when a page comes back short.
      security: [{}, {apiKey: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/SessionStatus"}}
        - {name: cursor, in: query, schema: {type: string}, description: "`next_cursor` from the page before."}
      responses:
        "200":
          description: One page of sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, next_cursor]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id: {type: string}
                        status: {$ref: "#/components/schemas/SessionStatus"}
                        image_count: {type: integer}
                        created_at: {type: string, format: date-time}
                        updated_at: {type: string, format: date-time}
                  next_cursor: {type: [string, "null"], description: "`null` on the last page."}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    post:
      tags: [Sessions]
      summary: Upload a document and start converting it
      description: |
        One `images` part per file; the order of the parts is the order of the pages, whatever the filenames.
        `images` is the only part read: there are no per-session options, and an old `config` part is
        ignored. PNG, JPEG, GIF, WebP and PDF. Each PDF page becomes an image, in page order, and the total
        pages across all parts are capped (`GET /v1/limits`).

        - An image over the per-image size limit is refused here with 400, before anything runs. The limit
          is the vision model's, so ask `GET /v1/limits` rather than assuming one.
        - A PDF is not measured against it, but each rendered page is. A page that renders too large is
          rendered again, smaller (logged as `page_refit`). One still too large after that, usually a dense
          photographic scan, is refused with 400 naming the page, the PDF and the size tried.
        - Pixel size is rarely the problem: the model shrinks anything over its long edge before reading it,
          so extra pixels buy nothing. The one hard ceiling is `max_dimension_px` (8,000 px on either edge),
          checked from the file's header.

        The new session is `queued`, and `running` once a run slot is free (`defaults.max_concurrent_runs`,
        default 2). Beyond that it waits in order, as long as it takes; the run log's `run_queued` and
        `run_dequeued` show the wait.
      security: [{}, {apiKey: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images: {type: array, items: {type: string, format: binary}}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {$ref: "#/components/schemas/SessionStatus"}
                  image_count: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}:
    get:
      tags: [Sessions]
      summary: Where a session is
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The session.
          content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
      description: |
        Poll until `status` is `ready_for_review` or `failed`.

        - `error` appears on a failed session and only there: the message the run threw, the same one its
          `run_failed` log line carries. Branch on `status`, not on the field.
        - `phase` means something only while `status` is `running`. A `queued` session reports the phase it
          will start in. Treat the list as open: show an unknown value as it is.
        - Where `storage.session_retention_days` is set, a finished session unchanged for that many days has
          its files deleted. This answer then has `expired_at`, and the session's other routes answer 410
          `session_expired`.

  /v1/sessions/{id}/output:
    get:
      tags: [Sessions]
      summary: The accessible HTML
      description: |
        Content-only accessible HTML, once `ready_for_review` (409 before).

        - Provenance is in the run log, not in the HTML.
        - A form control named after a PDF field gets a readable name (`case-number`, not
          `SC-100[0].Page1[0].CN[0].CaseNumber[0]`). `/fields` and `/pdf` keep the PDF's own names.
        - `<!-- @unresolved -->` at the end lists problems the review left open.
        - `<!-- @editor-truncated -->` means a correction round's answer hit the model's output ceiling. Its
          form says what got corrected: `blocks B of T` (the first B of T blocks, the rest asked again by
          section or left; a passage moved backwards across that point may now appear twice), `sections C of N` (the whole body redone section by section), or bare (nothing
          rescued, so none of the listed problems was worked on).
        - `<!-- @lint-unavailable -->` means axe could not run, so nothing was checked.
        - Images are `<img>` with a description and a placeholder `src` naming the page and the graphic.
          Iris serves no image files, so those references do not resolve; the `alt` carries the content.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The document.
          content: {text/html: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/logs:
    get:
      tags: [Sessions]
      summary: The run log
      description: One JSON line for each thing Iris did, written as it works. `/how-it-works` explains every line; docs/run-log.md defines the fields code reads.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The log.
          content: {application/x-ndjson: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/diagnostics:
    get:
      tags: [Sessions]
      summary: Timing, tokens and health of the latest run
      description: |
        Read from the run log. `in_flight` names the call a run is waiting on, if any. Field meanings in
        full: docs/run-log.md, "Diagnostics".
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, status, phase, started_at, last_event_at, elapsed_ms, in_flight, in_flight_count, phase_durations_ms, model_calls, tokens, by_agent, by_step, slowest_calls, errors, verification, tables, editor_ceiling, pages_failed, pages_blank, pages_bare_html, fidelity_observed]
                properties:
                  session_id: {type: string}
                  status: {$ref: "#/components/schemas/SessionStatus"}
                  phase: {$ref: "#/components/schemas/Phase"}
                  started_at: {type: [string, "null"]}
                  last_event_at: {type: [string, "null"]}
                  elapsed_ms: {type: integer}
                  in_flight:
                    type: [object, "null"]
                    description: The longest-waiting open model call.
                    required: [agent, step, model, provider, capability, since, waiting_ms]
                    properties:
                      agent: {type: string}
                      step: {type: string}
                      model: {type: string}
                      provider: {type: string}
                      capability: {type: string}
                      since: {type: string}
                      waiting_ms: {type: integer}
                  in_flight_count: {type: integer}
                  phase_durations_ms: {type: object, additionalProperties: {type: integer}}
                  model_calls:
                    type: object
                    required: [count, failed, total_ms, avg_ms, max_ms, concurrency_factor]
                    properties:
                      count: {type: integer}
                      failed: {type: integer}
                      total_ms: {type: integer}
                      avg_ms: {type: integer}
                      max_ms: {type: integer}
                      concurrency_factor: {type: number, description: Total call time over elapsed time.}
                  tokens:
                    type: object
                    required: [input, output, cache_read, cache_write, calls_reported]
                    properties:
                      input: {type: integer}
                      output: {type: integer}
                      cache_read: {type: integer}
                      cache_write: {type: integer}
                      calls_reported: {type: integer}
                    description: "`input` excludes cache reads. Never summed here."
                  by_agent: {type: object, additionalProperties: {$ref: "#/components/schemas/Usage"}}
                  by_step: {type: object, additionalProperties: {$ref: "#/components/schemas/Usage"}}
                  slowest_calls:
                    type: array
                    description: The five slowest calls.
                    items:
                      type: object
                      required: [agent, step, model, capability, duration_ms, ok]
                      properties:
                        agent: {type: string}
                        step: {type: string}
                        model: {type: string}
                        capability: {type: string}
                        duration_ms: {type: integer}
                        ok: {type: boolean}
                  errors: {type: array, description: Failed calls and runs. Empty means the run is not in doubt., items: {type: object, required: [ts, type, message], properties: {ts: {type: [string, "null"]}, type: {type: string}, message: {type: string}}}}
                  verification:
                    type: object
                    required: [pages_verified, pages_unjudged, pages_skipped_blank, pages_verify_error, verify_failed, verify_kinds, verify_untagged_problems, verify_inconsistent, corrections, results, triggers, declined, effects, rechecks]
                    properties:
                      pages_verified: {type: integer}
                      pages_unjudged: {type: integer}
                      pages_skipped_blank: {type: integer}
                      pages_verify_error: {type: integer}
                      verify_failed: {type: integer}
                      verify_kinds:
                        type: object
                        required: [content_missing, content_wrong, structure_wrong, a11y_only, alt_quality, untagged_pages]
                        properties:
                          content_missing: {type: integer}
                          content_wrong: {type: integer}
                          structure_wrong: {type: integer}
                          a11y_only: {type: integer}
                          alt_quality: {type: integer}
                          untagged_pages: {type: integer}
                      verify_untagged_problems: {type: integer}
                      verify_inconsistent:
                        type: object
                        required: [pages, content_missing, content_wrong, structure_wrong, a11y_only, alt_quality, content_or_structure, undecided_pages]
                        properties:
                          pages: {type: integer}
                          content_missing: {type: integer}
                          content_wrong: {type: integer}
                          structure_wrong: {type: integer}
                          a11y_only: {type: integer}
                          alt_quality: {type: integer}
                          content_or_structure: {type: integer}
                          undecided_pages: {type: integer}
                      corrections: {type: integer}
                      results:
                        type: object
                        required: [kept, rejected, identical, empty, failed]
                        properties:
                          kept: {type: integer}
                          rejected: {type: integer}
                          identical: {type: integer}
                          empty: {type: integer}
                          failed: {type: integer}
                      triggers:
                        type: object
                        required: [verify, links, alt, ids, words, numbers, both]
                        properties:
                          verify: {type: integer}
                          links: {type: integer}
                          alt: {type: integer}
                          ids: {type: integer}
                          words: {type: integer}
                          numbers: {type: integer}
                          both: {type: integer}
                      declined:
                        type: object
                        required: [pages, problems, problems_offered, code_checked, words, numbers, unattributed]
                        properties:
                          pages: {type: integer}
                          problems: {type: integer}
                          problems_offered: {type: integer}
                          code_checked: {type: integer}
                          words: {type: integer}
                          numbers: {type: integer}
                          unattributed: {type: integer}
                      effects:
                        type: object
                        required: [alt_only, text, attrs, structure, text_grew, text_shrank]
                        properties:
                          alt_only: {type: integer}
                          text: {type: integer}
                          attrs: {type: integer}
                          structure: {type: integer}
                          text_grew: {type: integer}
                          text_shrank: {type: integer}
                      rechecks:
                        type: object
                        required: [sampled, sampled_ok, sampled_unjudged, sampled_problems_before, sampled_problems_after, binding, binding_ok, binding_unjudged, binding_error, failures, verdicts_omitted]
                        properties:
                          sampled: {type: integer}
                          sampled_ok: {type: integer}
                          sampled_unjudged: {type: integer}
                          sampled_problems_before: {type: integer}
                          sampled_problems_after: {type: integer}
                          binding: {type: integer}
                          binding_ok: {type: integer}
                          binding_unjudged: {type: integer}
                          binding_error: {type: integer}
                          failures: {type: array, description: "Failing recheck verdicts, at most 20, each message at most 600 characters plus a mark.", items: {type: object, required: [ts, page, binding, message], properties: {ts: {type: [string, "null"]}, page: {type: [integer, "null"]}, binding: {type: [boolean, "null"]}, message: {type: string}}}}
                          verdicts_omitted: {type: integer}
                    description: The verify-then-correct loop.
                  tables:
                    type: object
                    required: [joined_in_code, joined_by_editor, joined_in_code_with_halves, code_declined, code_declined_with_halves, header_compared, header_differs, body_unreadable, failed, capped_pending]
                    properties:
                      joined_in_code: {type: integer}
                      joined_by_editor: {type: integer}
                      joined_in_code_with_halves: {type: integer}
                      code_declined: {type: integer}
                      code_declined_with_halves: {type: integer}
                      header_compared: {type: integer}
                      header_differs: {type: integer}
                      body_unreadable: {type: integer}
                      failed: {type: integer}
                      capped_pending: {type: integer}
                    description: Tables split across a page.
                  editor_ceiling:
                    type: object
                    required: [truncated, salvaged, salvaged_closed, retreated, declined, decline_reasons]
                    properties:
                      truncated: {type: integer}
                      salvaged: {type: integer}
                      salvaged_closed: {type: integer}
                      retreated: {type: integer}
                      declined: {type: integer}
                      decline_reasons:
                        type: object
                        required: [no_edits_list, no_complete_edit, unknown_block, unreadable_edit, out_of_order, all_refused, loss_before_cut, unrecognized]
                        properties:
                          no_edits_list: {type: integer}
                          no_complete_edit: {type: integer}
                          unknown_block: {type: integer}
                          unreadable_edit: {type: integer}
                          out_of_order: {type: integer}
                          all_refused: {type: integer}
                          loss_before_cut: {type: integer}
