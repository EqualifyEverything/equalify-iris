openapi: 3.1.0
info:
  title: Equalify Iris API
  version: 1.3.0
  summary: Turn a PDF or page images into accessible HTML, and optionally tag the original PDF.
  description: |
    The exact contract for every endpoint. To see each one work on a real document, in plain
    language, open `/how-it-works` on a running Iris.

    There is no sign-in and no account. A deployment is open or gated. Open: `server.api_token` is
    blank, so send no `Authorization` header. Gated: send `Authorization: Bearer <the token>`. The
    token says whether a caller may use the API, not who they are: every session belongs to the
    deployment. `GET /v1/me` with no header answers 200 when open and 401 when gated.

    The token covers `/v1/me`, `/v1/settings` and everything under `/v1/sessions`. The rest stays
    reachable on a gated deployment, on purpose: none of it touches a document. `/v1/health` is for
    load balancers, `/v1/limits` lets someone check a file before sending it, `/v1/stats` is a
    deployment-wide tally, and `/v1/quality` and `/v1/suggestions` have their own token.

    Errors share one shape, `{"error": {"code", "message", "details"}}`, except the two endpoints
    behind the quality token, which answer `{"error", "message"}`.

    Every `/v1` response except `/v1/health` carries `ratelimit` and `ratelimit-policy` headers.
    `test/e2e.sh` makes these calls against mocks and checks each answer against this document.
servers:
  - url: /
tags:
  - name: Deployment
    description: What this deployment is, accepts and has done.
  - name: Sessions
    description: One document's conversion, from upload to the finished HTML.
  - name: Tagged PDF
    description: The original PDF, tagged by iris-pdf. Only where the deployment makes them.
  - name: Audit
    description: Page images, prompts and the document between steps. Only in audit mode.
  - name: Operators
    description: Deployment-wide numbers, behind the quality token.

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "`server.api_token`. Needed only where the deployment sets it."
    qualityToken:
      type: http
      scheme: bearer
      description: "`server.quality_token`. The endpoint answers 404 when it is not set."
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^ses_[A-Za-z0-9]+$"}
  responses:
    Error:
      description: An error. `code` is one of `ErrorCode`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TokenError:
      description: Missing or wrong quality token (401), or the endpoint is off (404).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TokenError"}
  schemas:
    ErrorCode:
      type: string
      description: |
        Iris's own codes are listed in `x-codes`. On `/fields` and `/pdf`, iris-pdf's own codes pass
        through as well, such as `permissions_denied` or `values_not_permitted`.
      x-codes:
        - invalid_request
        - body_too_large
        - upload_too_large
        - unauthorized
        - rate_limited
        - not_found
        - session_not_found
        - session_expired
        - invalid_state
        - pdf_conversion_failed
        - audit_off
        - tagged_pdf_unavailable
        - no_source_pdf
        - tagger_failed
        - timeout
        - busy
        - server_error
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, description: A sentence a person can act on.}
            details: {type: object, description: Numbers behind the error, such as a limit.}
    TokenError:
      type: object
      required: [error, message]
      properties:
        error: {type: string, enum: [unauthorized, not_found]}
        message: {type: string}
    SessionStatus:
      type: string
      enum: [queued, running, ready_for_review, closed, failed]
      description: |
        `queued` waits for a free slot; `running` is working; `ready_for_review` has its HTML;
        `closed` was accepted; `failed` has an `error`.
    Phase:
      type: string
      enum: [extraction, assembly, review, done]
      description: The step a running session is in.
    Session:
      type: object
      required: [session_id, status, phase, iterations_completed, iterations_max, image_count, created_at, updated_at]
      properties:
        session_id: {type: string}
        status: {$ref: "#/components/schemas/SessionStatus"}
        phase: {$ref: "#/components/schemas/Phase"}
        iterations_completed: {type: integer, description: Review rounds finished.}
        iterations_max: {type: integer, description: The review cap this session got when it was made.}
        image_count: {type: integer, description: Pages.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        error: {type: string, description: Only on a failed session.}
        expired_at: {type: string, format: date-time, description: Only once retention deleted its files.}
    Usage:
      type: object
      properties:
        count: {type: integer}
        total_ms: {type: integer}
        max_ms: {type: integer}
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        cache_read_input_tokens: {type: integer}
        cache_creation_input_tokens: {type: integer}
        models: {type: array, items: {type: string}}
    Field:
      type: object
      required: [name, type, page]
      properties:
        name: {type: string, description: The PDF's own field name. Send values under it.}
        label: {type: string, description: The field's tooltip, when the PDF has one.}
        type: {type: string, enum: [text, checkbox, radio, combobox, listbox, button, signature]}
        page: {type: integer}
        rect: {type: array, items: {type: number}}
        options: {type: array, items: {type: string}}
        required: {type: boolean}
        readonly: {type: boolean}
        maxlen: {type: [integer, "null"]}
        editable: {type: boolean}
        multiSelect: {type: boolean}
        created: {type: boolean, description: A field iris-pdf would add to a flat form.}

paths:
  /v1/health:
    get:
      tags: [Deployment]
      summary: Is Iris up?
      description: |
        `version` is the running build's, so this is how you check a deployment is the one you meant to
        deploy. Never gated and never rate limited: the container's `HEALTHCHECK` polls it.
      responses:
        "200":
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, enum: [ok]}
                  service: {type: string}
                  version: {type: string}

  /v1/openapi.json:
    get:
      tags: [Deployment]
      summary: This document, as JSON
      responses:
        "200": {description: The OpenAPI document.}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/stats:
    get:
      tags: [Deployment]
      summary: How much this deployment has converted
      description: A public tally, cached for 60 seconds. No per-session detail.
      responses:
        "200":
          description: The tally.
          content:
            application/json:
              schema:
                type: object
                required: [pages_processed, documents_processed, since]
                properties:
                  pages_processed: {type: integer, description: Pages delivered, counting each document's first run.}
                  documents_processed: {type: integer}
                  since: {type: [string, "null"], format: date-time, description: When the earliest counted document finished.}
                  quality:
                    type: [object, "null"]
                    description: "`null` until the last 30 days hold enough documents to say."
                    properties:
                      window_days: {type: integer}
                      documents: {type: integer}
                      clean_rate: {type: number, description: Share of documents finished with nothing left open.}
                      mean_rounds: {type: number, description: Average review rounds per document.}
        "429": {$ref: "#/components/responses/Error"}

  /v1/limits:
    get:
      tags: [Deployment]
      summary: What an upload may be
      description: The same limits the upload enforces, so a client can say no before sending.
      responses:
        "200":
          description: The limits.
          content:
            application/json:
              schema:
                type: object
                required: [max_pages, image, pdf, upload, rate_limits, tagged_pdf]
                properties:
                  max_pages: {type: integer}
                  image:
                    type: object
                    properties:
                      max_bytes: {type: integer}
                      max_long_edge_px: {type: integer, description: The size the vision model reads at.}
                      max_dimension_px: {type: integer}
                      media_types: {type: array, items: {type: string}}
                      extensions: {type: array, items: {type: string}}
                      hint: {type: string, description: The limits as a sentence.}
                  pdf: {type: object, properties: {max_pages: {type: integer}}}
                  upload: {type: object, properties: {max_files: {type: integer}, max_request_bytes: {type: integer}}}
                  rate_limits:
                    type: [object, "null"]
                    description: "`null` when limits are off."
                    properties:
                      general_per_minute: {type: integer}
                      upload_per_minute: {type: integer}
                      max_upload_memory_mb: {type: integer}
                      window_seconds: {type: integer}
                  tagged_pdf: {type: boolean, description: Whether this deployment makes tagged PDFs.}
        "429": {$ref: "#/components/responses/Error"}

  /v1/me:
    get:
      tags: [Deployment]
      summary: Can I use this deployment?
      description: |
        Call this first. It runs the same check an upload runs, so 200 means usable (and, with no header,
        open), and 401 means the deployment needs `server.api_token` from its operator.
        `defaults.max_review_iterations` is the review cap every new session gets.
      security: [{}, {apiKey: []}]
      responses:
        "200":
          description: Usable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaults: {type: object, properties: {max_review_iterations: {type: integer}}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/settings:
    get:
      tags: [Deployment]
      summary: How this deployment is set up
      description: |
        Every non-secret setting as Iris uses it, after defaults, and the provider and model each agent
        resolves to for each kind of call. `agents` lists the four agents every run uses, then the
        specialists in `agents/`. `purpose` is the opening of an agent file's Purpose section, `null` for
        the reader and copy editor, whose prompts are in the code. Which kinds of call an agent makes
        depends on the step: a run's `model_call` lines say what ran. `prices` are the operator's, in US
        dollars per million tokens. Never a key, token, provider URL, file path or inference-profile ARN.
      security: [{}, {apiKey: []}]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [version, access, run, retention_days, tagged_pdf, providers, agents]
                properties:
                  version: {type: string}
                  access:
                    type: object
                    properties:
                      api_key_required: {type: boolean}
                      audit: {type: boolean}
                      quality_report: {type: boolean}
                  run:
                    type: object
                    properties:
                      max_review_iterations: {type: integer}
                      extraction_concurrency: {type: integer, description: Pages read at once.}
                      max_concurrent_runs: {type: integer, description: Documents converted at once.}
                      recheck_sample_size: {type: integer}
                  retention_days: {type: [integer, "null"]}
                  tagged_pdf:
                    type: object
                    properties:
                      on: {type: boolean}
                      version: {type: [string, "null"]}
                      timeout_seconds: {type: integer}
                  providers:
                    type: object
                    properties:
                      default: {type: string}
                      blocks:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            api: {type: string}
                            region: {type: string}
                            default_model: {type: string}
                            per_capability: {type: object}
                            max_tokens: {type: integer}
                            prompt_cache: {type: boolean}
                            prompt_cache_ttl: {type: string}
                            inference_profiles: {type: array, items: {type: string}}
                            prices: {type: object, description: US dollars per million tokens, by model, as the operator set them.}
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        agent: {type: string}
                        kind: {type: string, enum: [core, specialist]}
                        purpose: {type: [string, "null"]}
                        models: {type: object, description: "Per capability (`vision`, `text`, `structured_output`): `{provider, model}`."}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/quality:
    get:
      tags: [Operators]
      summary: How good the output has been
      description: Rates over recent documents, for the weekly quality report. Cached for 60 seconds.
      security: [{qualityToken: []}]
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
          description: The window, in days. Out-of-range values are clamped.
      responses:
        "200":
          description: The tally. A rate is a share of `documents`, from 0 to 1.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_days: {type: integer, description: The window used.}
                  documents: {type: integer, description: Documents delivered in the window.}
                  files: {type: integer, description: Distinct uploads they came from.}
                  documents_unhashed: {type: integer, description: Documents too old to have an upload hash.}
                  since: {type: [string, "null"], format: date-time}
                  mean_rounds: {type: number, description: Average copy-editor rounds per document.}
                  unresolved_rate: {type: number, description: Finished with problems left open.}
                  first_read: {type: object, description: What the reader found before anything was fixed.}
                  unresolved_severity: {type: array, items: {type: object}, description: Problems left open, by severity.}
                  review_stopped: {type: array, items: {type: object}, description: Why the review ended, by reason.}
                  links_dropped_rate: {type: number, description: A link was lost by the copy editor.}
                  links_unresolved_rate: {type: number, description: A link points nowhere in the document.}
                  markup_unbalanced_rate: {type: number, description: An element is left unclosed.}
                  table_no_body_rate: {type: number, description: A table has no content rows.}
                  structural_defect_rate: {type: number, description: A label or reference names something missing.}
                  lint_error_rate: {type: number, description: The accessibility check could not run.}
                  lint_error_where: {type: array, items: {type: object}}
                  documents_linted: {type: integer, description: Documents the check examined.}
                  editor_truncated_rate: {type: number, description: A copy-editor answer was cut off.}
                  editor_truncated_lost_rate: {type: number, description: Part of the document got no copy-editor pass.}
                  editor_headings_gated_rate: {type: number, description: Edits were refused for losing headings.}
                  review_unread_rate: {type: number, description: Part of the last read came back unusable.}
                  unfinished_page_rate: {type: number, description: A page is marked as not fully transcribed.}
                  rules: {type: array, items: {type: object}, description: Accessibility rules still failing, most common first.}
        "401": {$ref: "#/components/responses/TokenError"}
        "404": {$ref: "#/components/responses/TokenError"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/suggestions:
    get:
      tags: [Operators]
      summary: Agents Iris suggested, for maintainers
      description: |
        Every suggestion this deployment saved, grouped. Every run gives back, with no opt-out:

        - a new-agent suggestion when a page holds content a specialist would handle better (name, page,
          reason)
        - an agent-update proposal when feedback produced a lesson that generalizes and passed the agent's
          fixtures (the lesson and the proposed prompt)

        Iris files nothing itself. A workflow, `.github/workflows/agent-suggestions.yml`, reads this, groups
        what means the same thing, and opens or updates one public issue per idea. Run it only against a
        deployment whose documents are public: the reasons and prompts are model-written text about them.
        Saving never fails a run; a failure is logged as `contribution_failed`.

        `key` groups names that differ only in case, punctuation, or a trailing "agent" or "specialist".
        `pages` and `reasons` hold the 10 most recent; `latest` is the newest proposal, with the full prompt
        in `content`. Same token as `/v1/quality`: 404 when unset, 401 without it.
      security: [{qualityToken: []}]
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_agents: {type: array, items: {type: object}}
                  agent_updates: {type: array, items: {type: object}}
        "401": {$ref: "#/components/responses/TokenError"}
        "404": {$ref: "#/components/responses/TokenError"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions:
    get:
      tags: [Sessions]
      summary: List sessions, newest first
      description: |
        Newest first. This lists every session, not just yours: with no sign-in, anyone who can call it sees
        every session's id, status, page count and times, and an id is all `/output` needs. Gate a
        deployment that handles anything private. To follow your own work, keep the `session_id` the upload
        returned.

        - `limit`: 20 by default, at most 100. Anything that is not an integer of 1 or more is the default.
        - `cursor`: pass `next_cursor` back byte for byte, percent-encoded in the URL (`%7C` for its `|`).
          It is checked against the exact format Iris writes, so anything else is 400, never a silent restart.
          Stop when `next_cursor` is `null`, not when a page comes back short.
      security: [{}, {apiKey: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/SessionStatus"}}
        - {name: cursor, in: query, schema: {type: string}, description: "`next_cursor` from the page before."}
      responses:
        "200":
          description: One page of sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, next_cursor]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id: {type: string}
                        status: {$ref: "#/components/schemas/SessionStatus"}
                        image_count: {type: integer}
                        created_at: {type: string, format: date-time}
                        updated_at: {type: string, format: date-time}
                  next_cursor: {type: [string, "null"], description: "`null` on the last page."}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    post:
      tags: [Sessions]
      summary: Upload a document and start converting it
      description: Parts named `images`, in reading order. Each PDF page becomes an image. The run starts now, or waits in `queued`.
      security: [{}, {apiKey: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images: {type: array, items: {type: string, format: binary}}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {$ref: "#/components/schemas/SessionStatus"}
                  image_count: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}:
    get:
      tags: [Sessions]
      summary: Where a session is
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The session.
          content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
      description: |
        Poll until `status` is `ready_for_review` or `failed`.

        - `error` appears on a failed session and only there: the message the run threw, the same one its
          `run_failed` log line carries. Branch on `status`, not on the field.
        - `phase` means something only while `status` is `running`. A `queued` session reports the phase it
          will start in. Treat the list as open: show an unknown value as it is.
        - Where `storage.session_retention_days` is set, a finished session unchanged for that many days has
          its files deleted. This answer then has `expired_at`, and the session's other routes answer 410
          `session_expired`.

  /v1/sessions/{id}/output:
    get:
      tags: [Sessions]
      summary: The accessible HTML
      description: |
        Content-only accessible HTML, once `ready_for_review` (409 before).

        - Provenance is in the run log, not in the HTML.
        - A form control named after a PDF field gets a readable name (`case-number`, not
          `SC-100[0].Page1[0].CN[0].CaseNumber[0]`). `/fields` and `/pdf` keep the PDF's own names.
        - `<!-- @unresolved -->` at the end lists problems the review left open.
        - `<!-- @editor-truncated -->` means a correction round's answer hit the model's output ceiling. Its
          form says what got corrected: `blocks B of T` (the first B of T blocks, the rest asked again by
          section or left), `sections C of N` (the whole body redone section by section), or bare (nothing
          rescued, so none of the listed problems was worked on).
        - `<!-- @lint-unavailable -->` means axe could not run, so nothing was checked.
        - Images are `<img>` with a description and a placeholder `src` naming the page and the graphic.
          Iris serves no image files, so those references do not resolve; the `alt` carries the content.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The document.
          content: {text/html: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/logs:
    get:
      tags: [Sessions]
      summary: The run log
      description: One JSON line for each thing Iris did, written as it works. `/how-it-works` explains every line; the run-log section of docs/API.md defines the fields code reads.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The log.
          content: {application/x-ndjson: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/diagnostics:
    get:
      tags: [Sessions]
      summary: Timing, tokens and health of the latest run
      description: Read from the run log. `in_flight` names the call a run is waiting on, if any.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {$ref: "#/components/schemas/SessionStatus"}
                  phase: {$ref: "#/components/schemas/Phase"}
                  started_at: {type: [string, "null"]}
                  last_event_at: {type: [string, "null"]}
                  elapsed_ms: {type: [integer, "null"]}
                  in_flight: {type: [object, "null"]}
                  in_flight_count: {type: integer}
                  phase_durations_ms: {type: object}
                  model_calls: {type: object}
                  tokens: {type: object}
                  by_agent: {type: object, additionalProperties: {$ref: "#/components/schemas/Usage"}}
                  by_step: {type: object, additionalProperties: {$ref: "#/components/schemas/Usage"}}
                  slowest_calls: {type: array, items: {type: object}}
                  errors: {type: array, items: {type: object}}
                  verification: {type: object}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/feedback:
    post:
      tags: [Sessions]
      summary: Ask Iris to fix something, as a new run
      description: |
        Starts a new run of the same document, with the feedback given to every agent. The delivered HTML
        is copied to `history/` first. Only when `ready_for_review`; until the new run finishes, more
        feedback gets 409. The answer is `running`, or `queued` when every run slot is busy.

        Iris routes the feedback (its `feedback_scoped` log line says which):

        - `document`: the pages are kept, the saved body is re-checked, and the review runs again with the
          feedback. For tone, wording, order or an accessibility rule.
        - `extraction`: the named pages are read again from their images, then joined and reviewed. For
          content that was misread or missed, which the reader cannot see because it never sees the images.

        It chooses `document` when the pages cannot be pinned down, or when the feedback claims more than half
        the document.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [feedback], properties: {feedback: {type: string}}}
      responses:
        "202":
          description: Accepted. Poll the session again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {type: string, enum: [running, queued]}
                  phase: {type: string, enum: [extraction]}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/close:
    post:
      tags: [Sessions]
      summary: Accept the document
      description: |
        Accept the document: the output is final and the session's scratch files are deleted. Its pages
        become examples future page-agent changes are checked against. Only when `ready_for_review` (409
        otherwise). Suggestions were already saved during the run, so close does nothing more.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: {type: object, properties: {session_id: {type: string}, status: {type: string, enum: [closed]}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/fields:
    get:
      tags: [Tagged PDF]
      summary: The PDF's form fields
      description: For a flat form, the fields iris-pdf would add. Needs one uploaded PDF.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The fields.
          content:
            application/json:
              schema: {type: object, properties: {fields: {type: array, items: {$ref: "#/components/schemas/Field"}}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/pdf:
    post:
      tags: [Tagged PDF]
      summary: The original PDF, tagged, with its form filled in
      description: Once `ready_for_review`. Values are never stored or logged. In audit mode the report adds `detail`.
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {values: {type: object, description: Field name to value.}}}
      responses:
        "200":
          description: The PDF and iris-pdf's report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename: {type: string}
                  pdf: {type: string, contentEncoding: base64}
                  report: {type: object, description: "What iris-pdf did and checked: source, pages, structure, form, verification, warnings, and in audit mode detail."}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit:
    get:
      tags: [Audit]
      summary: What audit mode kept for a session
      security: [{}, {apiKey: []}]
      parameters: [{$ref: "#/components/parameters/SessionId"}]
      responses:
        "200":
          description: The list, with a URL for each item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  pages: {type: array, items: {type: object, properties: {order: {type: integer}, name: {type: string}, media_type: {type: string}, bytes: {type: integer}, sha256: {type: string}, url: {type: string}}}}
                  files: {type: array, items: {type: object, properties: {name: {type: string}, bytes: {type: integer}, url: {type: string}}}}
                  runs: {type: array, items: {type: object}}
                  prompts: {type: object, properties: {count: {type: integer}, url: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
      description: |
        Audit mode only (`server.audit`, or `iris convert --audit`); otherwise 404 `audit_off`. Each run then
        keeps the prompts it sent and the document after joining and after each review round, served with
        the page images and working files. Answers while the run works. Anyone who can read a session can
        read all of this.

  /v1/sessions/{id}/audit/pages/{order}:
    get:
      tags: [Audit]
      summary: A page image, as the models saw it
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {name: order, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: The image.}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit/files/{name}:
    get:
      tags: [Audit]
      summary: One of the session's working files
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - name: name
          in: path
          required: true
          schema: {type: string, enum: [final.json, lint.json, links.json, fields.json, text-layer.json, unresolved.md, agent-updates.md, source.pdf]}
      responses:
        "200": {description: The file.}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit/prompts/{hash}:
    get:
      tags: [Audit]
      summary: One message as sent to a model
      description: Named by a `model_call_start` line's `prompt`.
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {name: hash, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      responses:
        "200":
          description: The text.
          content: {text/plain: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}

  /v1/sessions/{id}/audit/runs/{run}/{name}:
    get:
      tags: [Audit]
      summary: The document at one step of a run
      description: Sent as plain text, so a browser does not run it.
      security: [{}, {apiKey: []}]
      parameters:
        - {$ref: "#/components/parameters/SessionId"}
        - {name: run, in: path, required: true, schema: {type: integer}}
        - {name: name, in: path, required: true, schema: {type: string, pattern: "^(assembled|round-[0-9]+)$"}}
      responses:
        "200":
          description: The document body.
          content: {text/plain: {schema: {type: string}}}
        "404": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
