# Single-machine deployment. Set the variables in .env (see .env.example), then:
#
#   docker compose up

services:
  iris:
    build: .
    image: equalify-iris:latest
    ports:
      - "8080:8080"
    environment:
      IRIS_GITHUB_TOKEN: ${IRIS_GITHUB_TOKEN}
      IRIS_API_TOKEN: ${IRIS_API_TOKEN:-}
      IRIS_TRUST_PROXY: ${IRIS_TRUST_PROXY:-}
      IRIS_QUALITY_TOKEN: ${IRIS_QUALITY_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # For Bedrock, add the standard AWS credential variables.
    # Restart after a crash or reboot, but not after `docker compose stop`. A startup error,
    # like a missing token, restarts in a loop; `docker compose logs` shows the message.
    restart: unless-stopped
    # Same check as the Dockerfile, with this deployment's timings.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      # Sessions and the database. The container runs as uid 1000, so on Linux ./data must be
      # writable by it: `sudo chown -R 1000:1000 ./data`. Not needed on macOS or Windows.
      - ./data:/app/data
      # Read-only to Iris; changed only by `git pull`.
      - ./agents:/app/agents
      # To use your own config.yaml:
      # - ./config.yaml:/app/config.yaml:ro
