# Equalify Iris deployment configuration (PRD §10.3).
#
# ${ENV_VAR} references are expanded from the process environment at startup.
# Changes require a restart in v1 (hot-reload is out of scope).

server:
  port: 8080
  # Public base URL of this deployment. Used to build the GitHub OAuth
  # callback URL and surfaced in device-flow instructions.
  base_url: http://localhost:8080

storage:
  # Root directory for sessions/, tmp/, and the agents/ git checkout.
  data_dir: ./data
  # Path to the agent library git checkout. Modified ONLY by `git pull`
  # from upstream (PRD §8.1).
  agents_dir: ./agents
  # Session metadata store. SQLite by default; a postgres URL is a supported
  # alternative for multi-instance deployments (not implemented in v1).
  database: ./data/iris.sqlite

# GitHub OAuth is the only auth mechanism (PRD §9.1). The token is used to
# identify the user and, unless `issue_token` is set below, to file
# agent-suggestion issues on their behalf — so `repo` scope is requested.
# Nothing here opens pull requests: contributions are filed as issues
# (deviation from PRD §7.13 — see README "Implementation notes").
github:
  # Leave blank to use the bundled "Equalify Iris" OAuth App via the device flow
  # (no per-operator app setup needed — like the GitHub CLI). Set it only to
  # point at your own OAuth App. The client_id is not a secret.
  client_id: ${GITHUB_CLIENT_ID}
  # Only required for the WEB redirect flow (/auth/github/start + /callback). The
  # device flow (CLI/Postman) needs no secret. Never commit a real secret.
  client_secret: ${GITHUB_CLIENT_SECRET}
  # The upstream agent library repo — where agent-suggestion issues are filed.
  upstream_repo: ${IRIS_UPSTREAM_REPO}
  # GitHub host base URLs. Override for GitHub Enterprise (e.g.
  # https://github.example.com/api/v3 and https://github.example.com). Defaults
  # to public GitHub when omitted.
  api_base_url: ${GITHUB_API_BASE_URL}
  oauth_base_url: ${GITHUB_OAUTH_BASE_URL}
  # Optional override for who authors auto-filed agent-suggestion issues. Blank
  # (default): filed as the logged-in user. Set to a service-account PAT to file
  # everything under that bot account instead.
  issue_token: ${IRIS_GITHUB_TOKEN}

# LLM provider abstraction (PRD §10.3). Each agent declares a capability;
# the deployment decides which provider serves it.
providers:
  default: openrouter
  # Per-agent overrides. Two forms:
  #   <agent>: <provider>                      # route this agent to a provider
  #   <agent>: { provider: ..., model: ... }   # also pin a specific model
  # Model resolution falls back: per-agent model -> provider per_capability ->
  # provider default_model. Agent names are the file stem. The agents actually
  # dispatched today are: page (extraction), reader + copy_editor (review),
  # feedback (verify/classify/train), builder (drafts suggested agents), plus any
  # specialist in agents/ that the page agent names.
  per_agent: {}
    # page: { model: anthropic/claude-sonnet-4.6 }   # cheaper/faster extraction
    # table: { model: anthropic/claude-opus-4.7 }    # stronger model, same provider
    # reader: { provider: bedrock, model: us.anthropic.claude-haiku-4-5-20251001-v1:0 }
    # Run the Feedback Agent (VERIFY/CLASSIFY/TRAIN) on a DIFFERENT or stronger
    # model than the page agent, so verification doesn't share the generator's
    # blind spots (recommended):
    # feedback: { model: anthropic/claude-opus-4.7 }

  # OpenRouter model IDs are `vendor/model` slugs (dot-versioned). Full list:
  # https://openrouter.ai/models
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    default_model: anthropic/claude-opus-4.7
    # Output-token ceiling per call. A dense page (a full-page table or form) is
    # the binding case; hit the ceiling and the model stops mid-tag. Iris now
    # FAILS such a call rather than passing the fragment downstream, so if you see
    # "hit the ... output ceiling", raise this. Omit for the default (32000).
    max_tokens: 32000
    per_capability:
      vision: anthropic/claude-opus-4.7
      structured_output: anthropic/claude-opus-4.7
      text: anthropic/claude-opus-4.7

  # Bedrock model IDs are hyphen-versioned and need a region prefix: current
  # Claude models are cross-region-inference only, so the bare `anthropic.*` form
  # is rejected for on-demand use — use `us.` (or `global.`). Confirm what your
  # account/region has enabled with:
  #   aws bedrock list-inference-profiles --region us-east-1 \
  #     --query 'inferenceProfileSummaries[].inferenceProfileId'
  bedrock:
    region: us-east-1
    default_model: us.anthropic.claude-opus-4-7
    # See the note on openrouter.max_tokens above. Retries are handled by the AWS
    # SDK's own `standard` strategy (3 attempts, exponential backoff, throttling +
    # 5xx + network errors), so there is no retry knob here.
    max_tokens: 32000
    per_capability:
      vision: us.anthropic.claude-opus-4-7
      structured_output: us.anthropic.claude-opus-4-7
      text: us.anthropic.claude-opus-4-7

defaults:
  max_review_iterations: 3
  # How many pages to extract in parallel within a single run. Pages are
  # independent (one vision pass each), so this is a pure speed knob: a 25-page
  # document costs up to ~5 sequential model calls per page, and extracting
  # pages serially is the dominant source of end-to-end latency.
  #
  # Raise it if your provider's rate limits allow; lower it (or set 1 for fully
  # serial) if you hit 429s — note the Bedrock adapter does not retry yet, so a
  # rate-limit burst there fails the run. Clamped to 1..16; omit for the default.
  extraction_concurrency: 5
