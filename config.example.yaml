# Equalify Iris configuration. Copy to config.yaml.
# ${VAR} is read from the environment at startup. Restart to apply a change.

server:
  port: 8080
  # Printed at startup so you can check the running process is the one you meant to
  # deploy. Iris builds no URLs from it.
  base_url: http://localhost:8080
  # Callers must send `Authorization: Bearer <token>` to convert, read sessions or call
  # /v1/me. Blank means anyone who can reach Iris can use it, which the demo page needs.
  # Not a GitHub token.
  api_token: ${IRIS_API_TOKEN}
  # Secret for GET /v1/quality, read by the weekly quality report. Blank makes it 404.
  # Keep it separate from api_token.
  quality_token: ${IRIS_QUALITY_TOKEN}
  # true keeps each run's prompts and the document at each stage, and serves them, the page
  # images and the working files at /v1/sessions/{id}/audit (for /how-it-works). Anyone who
  # can read a session can then read all of that. Blank or false is off.
  audit: ${IRIS_AUDIT}
  # Number of proxies in front of Iris (1 behind one Caddy/nginx). Unset behind a proxy,
  # every caller shares one rate-limit bucket.
  trust_proxy: ${IRIS_TRUST_PROXY}
  # Per-address limits. GET /v1/limits shows what is in effect; a refused request gets 429.
  rate_limits:
    general_per_minute: 240
    upload_per_minute: 12
    # Upload megabytes being received at once, across all callers. Lower it on a small machine.
    max_upload_memory_mb: 256
    # false turns all limits off, e.g. when a proxy already limits.
    enabled: true

storage:
  data_dir: ./data
  # The agent library checkout. Changed only by `git pull`.
  agents_dir: ./agents
  database: ./data/iris.sqlite
  # Optional: delete a finished session's files after this many days without a change.
  # The session's row stays, so counts don't drop. Blank or 0 keeps everything.
  session_retention_days:

# Optional: return the uploaded PDF tagged, with form fields filled. Needs the `iris-pdf`
# command from https://github.com/EqualifyEverything/equalify-iris-pdf. Blank turns it off.
# Form values are used for one request and never stored.
tagged_pdf:
  command: ${IRIS_PDF_COMMAND}
  timeout_seconds: 300

# Optional: the demo page's name and logo. Blank shows "Equalify Iris - Uploader" with no logo.
# The logo is a .png, .jpg or .webp file, shown before the name (above it on a phone).
# logo_alt is its alt text, usually the text in the logo. The heading reads logo_alt then
# name, so name should not repeat it.
branding:
  name: ${IRIS_BRAND_NAME}
  logo_file: ${IRIS_BRAND_LOGO}
  logo_alt: ${IRIS_BRAND_LOGO_ALT}

# Which model serves each agent. docs/models.md says what to pick and what each costs.
providers:
  default: openrouter
  # Per-agent overrides: `<agent>: <provider>` or `<agent>: { provider: ..., model: ... }`.
  # Agents: page, reader, copy_editor, feedback, plus any specialist in `agents/`.
  # Any other key is ignored. A `model:` without `provider:` uses `default`. A model is
  # picked in this order: per_agent, then the provider's per_capability, then default_model. To add overrides, uncomment the
  # `per_agent:` key below too, and delete this empty one.
  per_agent: {}
  # per_agent:
  #   page: { provider: bedrock, model: us.openai.gpt-5.6-luna }   # needs `api: converse`
  #   copy_editor: { model: anthropic/claude-opus-4.7 }
  #   reader: { provider: bedrock, model: us.anthropic.claude-haiku-4-5-20251001-v1:0 }
  #   feedback: { model: anthropic/claude-opus-4.7 }

  # Any OpenAI-compatible endpoint works, including a local ollama or vLLM server. Keep the
  # block name and a non-empty api_key. The page agent needs a model that reads images.
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    default_model: anthropic/claude-sonnet-4.6
    # Output-token ceiling per call. Raise it if the log says a page hit it.
    max_tokens: 32000
    # Upload limits follow the model. Leave unset unless the model is newer than Iris or
    # not a Claude.
    # image_limits:
    #   max_base64_bytes: 5242880
    #   max_image_bytes: 3932160
    #   max_long_edge_px: 1568
    # Prompt caching is on. Turn it off only if the upstream rejects `cache_control`.
    # prompt_cache: false
    # `5m` (default) or `1h`. An hour pays off when documents arrive less than an hour apart.
    # prompt_cache_ttl: 1h
    per_capability:
      vision: anthropic/claude-sonnet-4.6
      structured_output: anthropic/claude-sonnet-4.6
      text: anthropic/claude-sonnet-4.6

  # Bedrock ids need a `us.` or `global.` prefix. Credentials come from the AWS chain.
  bedrock:
    region: us-east-1
    default_model: us.anthropic.claude-sonnet-4-6
    max_tokens: 32000
    per_capability:
      vision: us.anthropic.claude-sonnet-4-6
      structured_output: us.anthropic.claude-sonnet-4-6
      text: us.anthropic.claude-sonnet-4-6
    # `invoke` (default) reaches Claude models only. `converse` is needed for any other
    # model, and applies to every agent on this provider.
    # api: converse
    # To see a model's cost under a tag, call it through a tagged application inference
    # profile built on that same model. Map the model id to the profile's ARN (the id is kept
    # everywhere else):
    # inference_profiles:
    #   us.anthropic.claude-sonnet-4-6: arn:aws:bedrock:us-east-1:111122223333:application-inference-profile/example
    # US dollars per million tokens, for the cost estimates on /how-it-works. Iris reads no price
    # list: copy these from your bill or the provider's price page. A model with no entry is shown
    # as unpriced.
    # prices:
    #   us.anthropic.claude-sonnet-4-6: { input: 3.3, output: 16.5, cache_read: 0.33, cache_write: 4.125 }

defaults:
  # Review rounds per document. Read once, when the database is created. Set it before the
  # first run.
  max_review_iterations: 3
  # Model calls one run makes at once (1-16). Lower it if you get 429s.
  extraction_concurrency: 5
  # Runs at once across all sessions (1-32). Extra uploads wait in a queue.
  max_concurrent_runs: 2
  # Corrected pages re-checked per run, for measurement only. 0 turns it off.
  recheck_sample_size: 1
