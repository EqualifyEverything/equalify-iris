name: ci

# The checks a merge waits on. `main`'s ruleset requires `test` and `scan`, and
# notify-uic-deploy.yml deploys a commit only after this workflow passed on it.
# The nightly run re-scans `main` for advisories published since it merged.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # By event too, so the nightly and a push to `main` cannot cancel each other's queued run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # No error tolerance here, unlike code-review.yml: without poppler the PDF tests
      # skip themselves and report as passes.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./test/e2e.sh
      # Same pinned version and checksum as code-review.yml; bump both together.
      # Unlike there, a failed download fails the check: a gate that skips is no gate.
      - name: actionlint
        run: |
          set -euo pipefail
          V=1.7.12
          curl -fsSL --retry 3 -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: shellcheck -s bash -S warning .github/scripts/*.sh

  # High or critical, with a fix available. An advisory nobody can fix yet is
  # reported in the log and does not block.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t iris-ci:${{ github.sha }} .
      # The base image's own npm is skipped: Iris never runs it, and on 2026-09-30 it
      # held 7 fixed-upstream advisories that even npm 12.2.0 still bundled 3 of.
      # Nothing retires this skip on its own (`24-slim` floats, so Dependabot never
      # proposes a rebuild); to check, drop `skip-dirs` and see whether `scan` passes.
      - name: Scan the image (OS packages and runtime node_modules)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iris-ci:${{ github.sha }}
          skip-dirs: /usr/local/lib/node_modules/npm
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the lockfile (dev dependencies included)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # A nightly failure opens one issue, or comments on the open one.
  report:
    needs: scan
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          set -euo pipefail
          TITLE="Nightly security scan failed on main"
          # A failed search files a new issue rather than none.
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "A high or critical advisory with a fix now affects \`main\`. Details: $RUN_URL"
          fi
